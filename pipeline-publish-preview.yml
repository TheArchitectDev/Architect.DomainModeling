trigger:
- master
pr: none

pool:
  vmImage: 'windows-latest'

steps:

# Runtimes needed because of test multi-targeting
- task: UseDotNet@2
  displayName: 'Install .NET 8 runtime (multi-target support)'
  inputs:
    packageType: 'runtime'
    version: '8.0.x'
    performMultiLevelLookup: true
- task: UseDotNet@2
  displayName: 'Install .NET 9 runtime (multi-target support)'
  inputs:
    packageType: 'runtime'
    version: '9.0.x'
    performMultiLevelLookup: true

# Can remove this once Microsoft updates the VM image to include .NET 10
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK (until image is updated)'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'
    performMultiLevelLookup: true

# Explicit restore helps avoid the issue described here:
# https://developercommunity.visualstudio.com/content/problem/983843/dotnet-build-task-does-not-use-nugetorg-for-one-pr.html
- task: DotNetCoreCLI@2
  displayName: 'DotNet Restore'
  inputs:
    command: 'restore'
    includeNugetOrg: true
    projects: |
      **/*.csproj
      !**/*Tests*.csproj

#- task: DotNetCoreCLI@2
#  displayName: 'DotNet Build'
#  inputs:
#    command: 'build'
#    arguments: '/WarnAsError --no-restore --configuration Release'
#    projects: |
#      **/*.csproj
#
#- task: DotNetCoreCLI@2
#  displayName: 'DotNet Test'
#  inputs:
#    command: 'test'
#    arguments: '--no-restore --no-build --configuration Release'
#    projects: |
#      **/*Tests*.csproj

# DotNet Pack needs to be run from a script in order to use --version-suffix
- script: dotnet pack $(Build.SourcesDirectory)/DomainModeling/DomainModeling.csproj --no-restore --configuration Release --version-suffix "preview-$(Build.BuildNumber)" -o $(Build.ArtifactStagingDirectory)
  displayName: 'DotNet Pack'

- task: NuGetCommand@2
  displayName: 'NuGet Push'
  inputs:
    command: 'push'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'NuGet'
